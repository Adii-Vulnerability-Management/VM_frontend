name: GRC3 Product DEV - Deploy (SSM + PM2)

on:
  push:
    branches:
      - dev-env

jobs:

  # =====================================
  # STAGE 1 - VALIDATE BUILD
  # Verify frontend builds successfully
  # =====================================
  validate:
    name: Validate Frontend Build
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Validate Production Build
        run: npm run build

  # =====================================
  # STAGE 2 - DEPLOY TO EC2
  # Deploy application through AWS SSM
  # =====================================
  deploy:
    name: Deploy to DEV EC2
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # ---------------------------------
      # Notify deployment started
      # ---------------------------------
      - name: Slack - Deployment Started
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🚀 *GRC3 DEV Frontend Deployment Started*\n• Branch: dev-env\n• Triggered by: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ---------------------------------
      # Configure AWS OIDC Authentication
      # ---------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---------------------------------
      # Deploy Application Through SSM
      # ---------------------------------
      - name: Deploy Application
        run: |

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.DEV_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GRC3 DEV Frontend Deployment" \
            --parameters commands='[
              "sudo -u ubuntu bash -c \"\
              set -e

              echo ===== DEPLOYMENT STARTED =====

              cd /home/ubuntu/Dev_GRC/Frontend-GRC3

              echo Pulling latest code...
              git pull origin dev-env

              #git fetch origin dev-env
              #git reset --hard origin/dev-env

              #echo Installing dependencies...
              npm ci --prefer-offline --no-audit

              echo Building frontend...
              npm run build

              echo Restarting PM2...
              pm2 restart frontend-grc3

              echo ===== DEPLOYMENT COMPLETED =====
              \""
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          # ---------------------------------
          # Poll SSM Status
          # ---------------------------------
          for i in {1..180}; do

            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Current Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then

              echo "Deployment Successful"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.DEV_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text

              exit 0

            elif [ "$STATUS" = "Failed" ] || \
                 [ "$STATUS" = "Cancelled" ] || \
                 [ "$STATUS" = "TimedOut" ]; then

              echo "Deployment Failed"

              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.DEV_INSTANCE_ID }}"

              exit 1
            fi

            sleep 5
          done

          echo "Timeout waiting for deployment"
          exit 1

      # ---------------------------------
      # Slack Success Notification
      # ---------------------------------
      - name: Slack - Deployment Successful
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "✅ *GRC3 DEV Frontend Deployment Successful*\n• Branch: dev-env\n• Deployed by: ${{ github.actor }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ---------------------------------
      # Slack Failure Notification
      # ---------------------------------
      - name: Slack - Deployment Failed
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "🔥 *GRC3 DEV Frontend Deployment Failed*\n• Branch: dev-env\n• Triggered by: ${{ github.actor }}\n• Check GitHub Actions Logs"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
