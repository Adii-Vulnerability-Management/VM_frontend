name: Frontend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.FRONTEND_ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
  ECS_SERVICE: ${{ vars.FRONTEND_ECS_SERVICE }}
  ECS_TASK_DEFINITION_FAMILY: ${{ vars.FRONTEND_TASK_FAMILY }}
  CONTAINER_NAME: ${{ vars.FRONTEND_CONTAINER_NAME }}
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_APP_URL }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --legacy-peer-deps
      - run: npm run lint --if-present
      # Same gap as the backend: this is lint-only, not a test suite.
      # Unchanged from the original — flagging again because it's still true.

  build-scan-push:
    name: Build, self-scan, and push image to ECR
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --build-arg NEXT_PUBLIC_API_PREFIX=priv \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Pinned to a commit SHA, not a version tag — see backend deploy.yml
      # for why (aquasecurity/trivy-action tag-hijacking compromise, Mar 2026).
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to ECS
    needs: build-scan-push
    runs-on: ubuntu-latest
    environment: production   # requires a manual-approval reviewer set on
                               # this GH Environment (Settings -> Environments)
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Render new task definition with the new image
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-scan-push.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

# ---------------------------------------------------------------------------
# What changed from the original, and what still isn't fixed:
#
# CHANGED:
#   - Static AWS_ACCESS_KEY_ID/SECRET -> OIDC role assumption. Requires the
#     GitHub OIDC provider + trust-scoped IAM role to already exist in AWS —
#     this file alone doesn't create them.
#   - Added a Trivy scan of the built image before push, failing on
#     HIGH/CRITICAL. Will likely fail on first run against the current base
#     image/deps until those are patched — that's the scan doing its job,
#     not a bug in the step.
#   - Added `environment: production` on deploy, which does nothing until
#     you configure required reviewers on that GitHub Environment. Without
#     that config this line is a no-op.
#
# NOT FIXED, still real:
#   - Test job is lint-only. No actual regression coverage before deploy.
#   - No rollback config — that lives on the ECS service (deployment
#     circuit breaker + rollback), not in this workflow file.
#   - Frontend and backend share one ECS cluster/ALB with path-based
#     routing; a bad backend deploy and a bad frontend deploy are two
#     independent single points of failure on the same edge, with no
#     canary or traffic-shifting between old/new task sets either way.
# ---------------------------------------------------------------------------